<div class="card">
  <div class="card-header">Customers</div>
  <div class="card-body">
    @if (errorMessage()) {
      <div class="alert alert-danger">{{ errorMessage() }}</div>
    }
    <table class="table table-striped">
      <thead>
        <tr><th>ID</th><th>Name</th><th>Email</th><th></th></tr>
      </thead>
      <tbody>
        @for (c of customers(); track c.id) {
          <tr>
            <td>{{ c.id }}</td>
            <td>{{ c.name }}</td>
            <td>{{ c.email }}</td>
            <td><button class="btn btn-sm btn-success" (click)="getBills(c)">Bills</button></td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
